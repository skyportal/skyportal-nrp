# Copy to 01-s3-credentials.yaml (gitignored), fill with an NRP S3 token, then:
#   kubectl apply -n skyportal -f 01-s3-credentials.yaml
#
# Generate the key pair yourself at the NRP User Portal (/s3token/) -> S3 Tokens,
# CENTRAL pool (admins confirmed Central has room for ~1 TB). Create the bucket
# named in destinationPath (09-backup.yaml) via awscli against
# https://s3-central.nrp-nautilus.io before enabling backups.
apiVersion: v1
kind: Secret
metadata:
  name: skyportal-db-s3
  namespace: skyportal
type: Opaque
stringData:
  ACCESS_KEY_ID: "CHANGE_ME_rgw_access_key"
  ACCESS_SECRET_KEY: "CHANGE_ME_rgw_secret_key"
