# Password for the demo instance's postgres superuser (17-demo-restore.yaml).
#
#   cp db/17-demo-db-credentials.example.yaml db/17-demo-db-credentials.yaml
#   # fill in POSTGRES_PASSWORD
#   kubectl apply -n skyportal -f db/17-demo-db-credentials.yaml
#
# The filled-in copy is gitignored. This value must match `database.password`
# in the app's own secret (secrets.yaml -> skyportal-secrets), or the app will
# fail to authenticate against the demo DB.
apiVersion: v1
kind: Secret
metadata: { name: skyportal-demo-db, namespace: skyportal }
type: Opaque
stringData: { POSTGRES_PASSWORD: "<demo-db-postgres-password>" }
