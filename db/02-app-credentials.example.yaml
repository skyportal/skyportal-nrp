# Copy to 02-app-credentials.yaml (gitignored), set the password, then:
#   kubectl apply -n skyportal -f 02-app-credentials.yaml
#
# This is the password for the `skyportal` application role that CNPG creates at
# bootstrap. It MUST equal database.password / postgres-password in the
# skyportal-secrets Secret (secrets.yaml), or the app can't log in to the DB.
#
# basic-auth type: username must match bootstrap.initdb.owner (skyportal).
apiVersion: v1
kind: Secret
metadata:
  name: skyportal-db-app
  namespace: skyportal
type: kubernetes.io/basic-auth
stringData:
  username: skyportal
  password: "CHANGE_ME_must_match_skyportal-secrets_postgres-password"
