# Copy to 07-gcs-credentials.yaml (gitignored), paste a GCP service-account JSON
# key, then: kubectl apply -n skyportal -f 07-gcs-credentials.yaml
#
# The SA needs only read on the dump bucket: grant roles/storage.objectViewer
# (ideally scoped to that one bucket). The restore Job's init container uses it to
# gsutil-rsync the dump onto the scratch PVC.
apiVersion: v1
kind: Secret
metadata:
  name: skyportal-db-gcs
  namespace: skyportal
type: Opaque
stringData:
  key.json: |
    {
      "type": "service_account",
      "project_id": "CHANGE_ME",
      "private_key_id": "CHANGE_ME",
      "private_key": "-----BEGIN PRIVATE KEY-----\nCHANGE_ME\n-----END PRIVATE KEY-----\n",
      "client_email": "CHANGE_ME@CHANGE_ME.iam.gserviceaccount.com",
      "client_id": "CHANGE_ME",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token"
    }
