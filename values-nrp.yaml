# NRP Nautilus overrides for the skyportal-k8s-deploy chart.
#   helm install skyportal ../skyportal-k8s-deploy/chart -f values-nrp.yaml -n skyportal

image:
  # Own package, not shared with Fritz: this image tracks the skyportal commit
  # pinned by our submodule, which is diverging from Fritz's.
  repository: ghcr.io/skyportal/skyportal-nrp
  # Built by .github/workflows/build-image.yml on push (and by `make image`
  # locally). The tag is sp-<skyportal submodule short sha>; skyportal-data
  # (sncosmo) is baked in by the Dockerfile, so no extra -rN suffix is needed.
  tag: "sp-ae69874"

# NRP west region (us-central storage is full).
postgres:
  storage:
    storageClassName: rook-ceph-block
    size: 100Gi   # expanded from the 20Gi default (babamul photometry growth)
persistentData:
  storageClassName: rook-cephfs
  size: 100Gi

ingress:
  className: haproxy              # NRP default ingress controller
  host: skyportal.nrp-nautilus.io
  tls:
    enabled: true
    clusterIssuer: ""             # VERIFY: NRP may front *.nrp-nautilus.io with a wildcard
                                  # cert (leave issuer empty); otherwise set a cert-manager issuer.

# Full workers list (Helm replaces lists). No babamul; OSG is separate (osg/).
roles:
  app:
    # 8 tornado processes (server.processes=8 in the config) need cores to match.
    resources:
      requests: { cpu: "2", memory: "2Gi" }
      limits:   { cpu: "8", memory: "6Gi" }
  workers:
    enabled:
      - cron
      - dask
      - external_logging
      - recurring_apis
      - facility_queue
      - gcn_service
      - health_monitor
      - hermes_skyportal_sync
      - ngsf_analysis_service
      - notification_queue
      - observation_plan_queue
      - openai_analysis_service
      - pdl_service
      - reminders
      - sharing_service_submission_queue
      - slack
      - sn_analysis_service
      - spectral_cube_analysis_service
      - thumbnail_queue
      - tns_retrieval_queue
      - watch_list

# Prometheus sidecar scraping the app workers (skyportal PR #6284). Needs the app
# config observability.enabled (set in skyportal-secrets) + skyportal-obs-secret.
observability:
  enabled: true
  prometheus:
    workers: 8      # match server.processes so all app workers are scraped
